<!-- ===== 輪播資料 + 模組（放在 body 結尾、Tailwind/FontAwesome 之後） ===== -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  // 你的實際檔名都在 docs 根目錄，所以用 ./檔名
  const dataSets = {
    two: [
      { src: './主菜-日式鹽麴雞腿排.png',              title: '日式鹽麴雞腿排' },
      { src: './主菜-法式油封杏鮑菇(素).png',          title: '法式油封杏鮑菇(素)' },
      { src: './主菜-獨家香料鹹豬肉.png',              title: '獨家香料鹹豬肉' },
      { src: './主菜-蔥油雞胸肉.png',                  title: '蔥油雞胸肉' }
    ],
    four: [
      { src: './雙主菜-日式鹽麴雞腿排x獨家香料鹹豬肉.jpg',     title: '雙主菜：鹽麴雞腿排 x 鹹豬肉' },
      { src: './雙主菜-法式油封杏鮑菇x日式牛肉漢堡排.jpg',     title: '雙主菜：油封杏鮑菇 x 牛肉漢堡排' },
      { src: './雙主菜-自製蔥油雞胸肉x獨家香料鹹豬肉.jpg',     title: '雙主菜：蔥油雞胸肉 x 鹹豬肉' },
      { src: './雙主菜-雙主菜 鯖魚一夜干x獨家香料鹹豬肉.jpg',  title: '雙主菜：鯖魚一夜干 x 鹹豬肉' }
    ],
    eight: [
      { src: './8格雙主菜-日式牛肉漢堡排x法式油封杏鮑菇.jpg',  title: '八格：牛肉漢堡排 x 油封杏鮑菇' },
      { src: './8格雙主菜-日式鹽麴雞腿排x獨家香料鹹豬肉.jpg',  title: '八格：鹽麴雞腿排 x 鹹豬肉' },
      { src: './8格雙主菜-韓式炸雞x獨家香料鹹豬肉.jpg',        title: '八格：韓式炸雞 x 鹹豬肉' },
      { src: './8格雙主菜-鯖魚一夜干x獨家香料鹹豬肉.jpg',      title: '八格：鯖魚一夜干 x 鹹豬肉' }
    ]
  };

  // 共用輪播初始化
  const initCarousel = ({
    moduleName,            // 只是用在 alt 的補字
    images,                // 上面 dataSets 裡某組
    coverImgId,            // 封面 <img> 的 id
    coverWrapId,           // 封面整塊容器 id（用來綁點擊開啟）
    modalId,               // 燈箱容器 id
    modalImgId,            // 燈箱內 <img> id
    prevBtnId, nextBtnId,  // 上/下一張按鈕 id
    closeBtnId, backdropId,// 關閉/背景 id
    counterId              // 計數用 span id
  }) => {
    const coverImg  = document.getElementById(coverImgId);
    const coverWrap = document.getElementById(coverWrapId);
    const modal     = document.getElementById(modalId);
    const modalImg  = document.getElementById(modalImgId);
    const prevBtn   = document.getElementById(prevBtnId);
    const nextBtn   = document.getElementById(nextBtnId);
    const closeBtn  = document.getElementById(closeBtnId);
    const backdrop  = document.getElementById(backdropId);
    const counter   = document.getElementById(counterId);

    if (!coverImg || !coverWrap || !modal || !modalImg || !images?.length) return;

    let idx = 0;
    const total = images.length;

    // 封面圖
    coverImg.src = images[0].src;
    coverImg.alt = images[0].title || `${moduleName}封面`;
    if (coverImg.complete) coverImg.classList.add('opacity-100');
    coverImg.onload = () => coverImg.classList.add('opacity-100');

    // 更新燈箱
    const update = (i) => {
      idx = (i + total) % total;
      const it = images[idx];
      modalImg.classList.remove('opacity-100');
      modalImg.src = it.src;
      modalImg.alt = it.title || `${moduleName} 第 ${idx+1} 張`;
      if (counter) counter.textContent = `${idx+1}/${total}`;
      if (modalImg.complete) modalImg.classList.add('opacity-100');
      modalImg.onload = () => modalImg.classList.add('opacity-100');
    };

    const open = () => {
      update(0);
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    };

    const close = () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
    };

    coverWrap.addEventListener('click', (e) => {
      // 點擊文字/箭頭以外的地方也可以開
      if (e.target.tagName !== 'SPAN' && e.target.tagName !== 'I') open();
      else open();
    });

    if (closeBtn)   closeBtn.addEventListener('click', close);
    if (backdrop)   backdrop.addEventListener('click', close);
    if (prevBtn)    prevBtn.addEventListener('click', () => update(idx - 1));
    if (nextBtn)    nextBtn.addEventListener('click', () => update(idx + 1));

    // 鍵盤操作
    document.addEventListener('keydown', (e) => {
      if (modal.classList.contains('hidden')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft')  update(idx - 1);
      if (e.key === 'ArrowRight') update(idx + 1);
    });
  };

  // 初始化三組
  initCarousel({
    moduleName:'二格盒',
    images: dataSets.two,
    coverImgId:'two-cover',
    coverWrapId:'two-box-cover',
    modalId:'two-modal',
    modalImgId:'two-modal-img',
    prevBtnId:'two-prev',
    nextBtnId:'two-next',
    closeBtnId:'two-close',
    backdropId:'two-backdrop',
    counterId:'two-counter'
  });

  initCarousel({
    moduleName:'四格盒',
    images: dataSets.four,
    coverImgId:'four-cover',
    coverWrapId:'four-box-cover',
    modalId:'four-modal',
    modalImgId:'four-modal-img',
    prevBtnId:'four-prev',
    nextBtnId:'four-next',
    closeBtnId:'four-close',
    backdropId:'four-backdrop',
    counterId:'four-counter'
  });

  initCarousel({
    moduleName:'八格盒',
    images: dataSets.eight,
    coverImgId:'eight-cover',
    coverWrapId:'eight-box-cover',
    modalId:'eight-modal',
    modalImgId:'eight-modal-img',
    prevBtnId:'eight-prev',
    nextBtnId:'eight-next',
    closeBtnId:'eight-close',
    backdropId:'eight-backdrop',
    counterId:'eight-counter'
  });
});
</script>
